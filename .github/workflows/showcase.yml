name: Showcase

# fshammer against real filesystems, each required to produce the outcome in scripts/showcase/expected/, and
# a standalone reproducer for each behaviour showcase/README.md reports. A red job means an outcome changed.

on:
  push:
    branches: [main]
    # only what can change an outcome; documentation and other workflows do not
    paths:
      - fshammer.py
      - scripts/showcase/**
      - .github/workflows/showcase.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "assert: require the recorded outcome. record: run each target three times and propose expectations"
        type: choice
        options: [assert, record]
        default: assert
      only:
        description: "space-separated target and reproducer names to run; empty runs everything"
        type: string
        default: ""

# a newer run on the same ref supersedes this one
concurrency:
  group: showcase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  showcase:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    # record mode runs each target three times, each up to its fshammer timeout (30 minutes by default)
    timeout-minutes: ${{ inputs.mode == 'record' && 150 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        target: [tmpfs, ext4, xfs, btrfs, overlayfs, davfs2, davfs2-ubuntu, sshfs, bindfs, bindfs-single, rclone,
                 samba, knfsd-v3, knfsd-v4.2, knfsd-v4.2-2client,
                 ganesha-v3, ganesha-v4.0, ganesha-v4.1, ganesha-v4.2, ganesha-v4.2-2client,
                 ganesha-9p-none, ganesha-9p-loose, ganesha-9p-mmap,
                 u9fs-none, u9fs-mmap, diod-none, diod-loose, diod-mmap]
    steps:
      - uses: actions/checkout@v7
        if: inputs.only == '' || contains(format(' {0} ', inputs.only), format(' {0} ', matrix.target))
      - if: inputs.only == '' || contains(format(' {0} ', inputs.only), format(' {0} ', matrix.target))
        run: scripts/showcase/run.sh ${{ matrix.target }}
        env:
          SHOWCASE_LOG: ${{ runner.temp }}/log
          SHOWCASE_MODE: ${{ inputs.mode || 'assert' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: showcase-${{ matrix.target }}
          path: ${{ runner.temp }}/log
          if-no-files-found: ignore

  plan:
    runs-on: ubuntu-24.04
    outputs:
      repros: ${{ steps.plan.outputs.repros }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        run: echo "repros=$(python3 scripts/showcase/repros.py matrix "${{ inputs.only }}")" >> "$GITHUB_OUTPUT"

  repro:
    name: repro ${{ matrix.repro }}
    needs: plan
    if: needs.plan.outputs.repros != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        repro: ${{ fromJSON(needs.plan.outputs.repros) }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          echo "kernel: $(uname -r)"
          scripts/showcase/repros.py run "${{ matrix.repro }}" "$RUNNER_TEMP/repro"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repro-${{ matrix.repro }}
          path: ${{ runner.temp }}/repro
          if-no-files-found: ignore

  # badge JSON per target and a summary, force-pushed as one commit to the orphan "status" branch
  status:
    needs: [showcase, repro]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || (inputs.mode == 'assert' && inputs.only == ''))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: ${{ runner.temp }}/artifacts
      - run: |
          out="$RUNNER_TEMP/status"
          python3 scripts/showcase/status.py "$RUNNER_TEMP/artifacts" "$out" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # publish only if this run's commit is still the tip of main, so a superseded run never overwrites
          # newer badges
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$tip" != "$GITHUB_SHA" ]; then
              echo "main is at $tip, not $GITHUB_SHA; not publishing"
              exit 0
          fi
          cd "$out"
          git init -q
          git checkout -q --orphan status
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Showcase status"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git" status
