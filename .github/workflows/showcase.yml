name: Showcase

# fshammer against real filesystems, each required to produce the outcome in scripts/showcase/expected/, and
# a standalone reproducer for each behaviour showcase/README.md reports. A red job means an outcome changed.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "assert: require the recorded outcome. record: run each target three times and propose expectations"
        type: choice
        options: [assert, record]
        default: assert

jobs:
  showcase:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    # record mode runs each target three times
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [tmpfs, davfs2, sshfs, bindfs, bindfs-single, rclone,
                 samba, knfsd-v3, knfsd-v4.2, ganesha-v4.1,
                 u9fs-none, u9fs-mmap, diod-none, diod-loose, diod-mmap]
    steps:
      - uses: actions/checkout@v7
      - run: scripts/showcase/run.sh ${{ matrix.target }}
        env:
          SHOWCASE_LOG: ${{ runner.temp }}/log
          SHOWCASE_MODE: ${{ inputs.mode || 'assert' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: showcase-${{ matrix.target }}
          path: ${{ runner.temp }}/log
          if-no-files-found: ignore

  repro:
    name: repro ${{ matrix.repro }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        repro: ["davfs2-readdir", "davfs2-utime-before-close", "samba-hardlink", "samba-utime-before-close",
                "knfsd-v4-lock-two-mounts", "sshfs-readdir-inode", "bindfs-hardlink",
                "rclone-truncate-grow", "rclone-rename-over-open",
                "9p-locks-9p2000", "9p-unlink-open u9fs", "9p-unlink-open diod", "9p-rename-ancestor",
                "9p-append u9fs none", "9p-append diod loose", "9p-append diod mmap",
                "9p-stat-during-append u9fs", "9p-rename-dir-loose"]
    steps:
      - uses: actions/checkout@v7
      - run: |
          echo "kernel: $(uname -r)"
          set -- ${{ matrix.repro }}
          script="$1"; shift
          scripts/showcase/repro/$script.sh "$@"
