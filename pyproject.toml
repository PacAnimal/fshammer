[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fshammer"
version = "1.0.0"
description = "A concurrent filesystem workload, verified against an in-memory model of every file"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["filesystem", "stress-test", "nfs", "fuse", "webdav", "posix", "data-integrity"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Filesystems",
]

[project.urls]
Homepage = "https://github.com/PacAnimal/fshammer"
Issues = "https://github.com/PacAnimal/fshammer/issues"

[project.scripts]
fshammer = "fshammer:main"

[tool.setuptools]
py-modules = ["fshammer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
